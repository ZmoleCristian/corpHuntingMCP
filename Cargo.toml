[package]
name = "corphuntingmcp"
version = "0.1.0"
edition = "2024"
authors = ["Zmole Cristian"]
description = "MCP server that searches jobs across ten ATS platforms at once. No API keys, no accounts — public job boards only."
license = "0BSD"
repository = "https://github.com/ZmoleCristian/corpHuntingMCP"
readme = "README.md"
keywords = ["mcp", "jobs", "ats", "ai", "rmcp"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["CLAUDE.md", "law.toml", ".claude", ".mcp.json", "doc"]

[[bin]]
name = "corphuntingmcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rmcp = { version = "0.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
moka = { version = "0.12", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
